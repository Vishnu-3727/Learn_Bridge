[versions]
agp = "9.3.0"
kotlin = "2.2.10"

# --- Inference stack, pinned to the versions the engine was benchmarked against. Do not bump. ---
# 1.27.1 is a GitHub tag only; no onnxruntime-android AAR was published for it.
onnxruntime = "1.27.0"
vosk = "0.3.47"
coroutines = "1.7.3"

# --- On-device generation. MediaPipe LLM Inference is maintenance-only (LiteRT-LM is the
# successor), which for this build is a feature: stable, published, and it will not move. ---
mediapipeGenai = "0.10.27"

# --- Document ingestion ---
# PdfBox-Android's last release is Jan 2023. Unmaintained but frozen; verify against AGP 9.3.
pdfbox = "2.0.27.0"
mlkitTextDevanagari = "16.0.1"

# --- AndroidX / Material ---
coreKtx = "1.12.0"
appcompat = "1.6.1"
material = "1.11.0"
activityKtx = "1.8.0"
constraintlayout = "2.1.4"
lifecycle = "2.7.0"

junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
robolectric = "4.11.1"

[libraries]
# Inference
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
vosk-android = { group = "com.alphacephei", name = "vosk-android", version.ref = "vosk" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# On-device LLM
mediapipe-tasks-genai = { group = "com.google.mediapipe", name = "tasks-genai", version.ref = "mediapipeGenai" }

# Ingestion
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfbox" }
mlkit-text-devanagari = { group = "com.google.mlkit", name = "text-recognition-devanagari", version.ref = "mlkitTextDevanagari" }

# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
# Needed only so DocStore/Retrieval (SQLite) can be unit-tested on the JVM without a device.
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
